*{box-sizing:border-box}body{margin:0;background:#101521;color:#f4f6fa;font:16px system-ui,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:#26344a;border:1px solid #45546a;border-radius:10px;padding:12px 16px}button.primary{background:#ff9b48;color:#17100a;border:0;font-weight:750}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #68c9ff}main{max-width:850px;margin:auto;padding:24px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h1{font-size:24px;margin:0;color:#ff9b48}h2{font-size:20px}small,.muted{color:#aab8cd}input,textarea,select{background:#192335;border:1px solid #45546a;border-radius:8px;padding:12px;width:100%}textarea{min-height:42vh;resize:vertical;line-height:1.55}label{display:block;margin:14px 0 6px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{background:#192335;border:1px solid #35465e;border-radius:12px;padding:16px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.item strong{display:block;overflow-wrap:anywhere}.item .bar{flex-shrink:0}#reader{position:fixed;inset:0;background:#030405;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}[hidden]{display:none!important}#top,#controls{background:#111722;padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;z-index:5}#top{justify-content:space-between}#controls button,#top button{padding:9px 12px;font-size:14px}#viewport{position:relative;flex:1;min-height:0;overflow:hidden}#scroll{position:absolute;inset:0;overflow:auto;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y}#scroll::-webkit-scrollbar{display:none}#words{margin:auto;white-space:pre-wrap;overflow-wrap:break-word;text-align:center;line-height:1.55;font-weight:600;color:white}#cue{pointer-events:none;position:absolute;t </style></head><body><main id="home"><header><div><h1>JuandiPrompter</h1><small>Tu guion. Tu ritmo.</small></div><button id="new" class="primary">+ Nuevo guion</button></header><section id="library"><h2>Mis guiones</h2><div id="list"></div><div class="bar"><button id="export">Exportar copia</button><button id="import">Importar copia</button><input id="file" type="file" accept="application/json,.json" hidden></div><p class="muted">Los guiones se guardan en este navegador. Exporta una copia para conservarlos o pasarlos al iPhone.</p></section><section id="editor" hidden><div class="bar"><button id="back">← Biblioteca</button><button id="save">Guardar</button><button id="start" class="primary">Abrir teleprompter</button></div><label for="name">Título</label><input id="name" placeholder="Nombre del guion"><label for="script">Guion</label><textarea id="script" placeholder="Pega tu guion aquí. Separa los bloques con una línea vacía."></textarea><p id="stats" class="muted"></p></section></main><section id="reader" hidden><div id="top"><button id="close">← Salir</button><span id="status">140 ppm</span><button id="config">⚙ Ajustes</button><button id="clean">Pantalla limpia</button></div><div id="viewport"><div id="scroll"><div id="words"></div></div><div id="cue"></div><div id="count" hidden></div></div><div id="progress"><i></i></div><div id="controls"><button id="reset">↺ Inicio</button><button id="prev">◀ Bloque</button><button id="play" class="primary">▶ Iniciar</button><button id="next">Bloque ▶</button><button id="slower">−</button><button id="faster">+</button><button id="mirror">Espejo</button></div><button id="exitclean">Mostrar controles</button><aside id="settings" hidden><strong>Ajustes de lectura</strong><label>Velocidad: <span id="speedval"></span> ppm</label><input id="speed" type="range" min="40" max="320" step="5"><label>Letra: <span id="sizeval"></span> px</label><input id="size" type="range" min="22" max="100"><label>Ancho del texto: <span id="widthval"></span>%</label><input id="width" type="range" min="35" max="100"><label>Cuenta regresiva</label><select id="delay"><option value="0">Sin cuenta regresiva</option><option value="3">3 segundos</option><option value="5">5 segundos</option><option value="10">10 segundos</option></select><label>Reflejo</label><select id="flip"><option value="none">Normal</option><option value="x">Horizontal</option><option value="y">Vertical</option><option value="xy">Ambos</option></select><p class="muted">Espacio: pausa. ↑/↓: velocidad. ←/→: bloque. Clic en texto: pausa. Rueda o gesto: mover.</p><button id="done" class="primary">Listo</button></aside></section><script>
const $=id=>document.getElementById(id);const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('No se pudo guardar en el navegador. Exporta una copia.');return false}}let scripts=load('jp-scripts',[]),prefs={speed:140,size:40,width:85,delay:3,flip:'none',...load('jp-prefs',{})},id=null,dirty=false,playing=false,waiting=false,timer=null,last=0,pos=0,blocks=[],wake=null;const sample='Este es un guion de prueba. Puedes cambiar la velocidad, el tamaño de letra y activar el modo espejo.\n\nCada párrafo separado por una línea vacía se convierte en un bloque. Así puedes repetir una parte sin volver a empezar todo el guion.';if(!scripts.length&&!load('jp-init',false)){scripts=[{id:'demo',name:'Guion de prueba',text:sample}];store('jp-scripts',scripts);store('jp-init',true)}function count(t){return t.trim()?t.trim().split(/\s+/).length:0}function showList(){ $('library').hidden=false;$('editor').hidden=true;const list=$('list');list.replaceChildren();if(!scripts.length)list.textContent='Todavía no tienes guiones.';for(const s of scripts){const item=document.createElement('div');item.className='item';const info=document.createElement('div'),title=document.createElement('strong'),meta=document.createElement('small');title.textContent=s.name;meta.textContent=count(s.text)+' palabras';info.append(title,meta);const bar=document.createElement('div');bar.className='bar';for(const [label,fn] of [['Editar',()=>edit(s)],['Borrar',()=>{if(confirm('¿Borrar este guion?')){scripts=scripts.filter(x=>x.id!==s.id);store('jp-scripts',scripts);showList()}}]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;bar.append(b)}item.append(info,bar);list.append(item)}}function edit(s){id=s?.id??null;$('name').value=s?.name??'';$('script').value=s?.text??'';$('library').hidden=true;$('editor').hidden=false;dirty=false;stats()}function stats(){const n=count($('script').value);$('stats').textContent=n+' palabras · '+Math.floor(n/prefs.speed)+' min '+Math.round(n/prefs.speed%1*60)+' s aprox.'}function save(){const text=$('script').value;if(!text.trim()){alert('Escribe o pega un guion.');return false}const s={id:id??(crypto.randomUUID?.()??String(Date.now())),name:$('name').value.trim()||'Sin título',text};const i=scripts.findIndex(x=>x.id===s.id);if(i<0)scripts.unshift(s);else scripts[i]=s;id=s.id;dirty=false;store('jp-scripts',scripts);return true}$('new').onclick=()=>edit();$('back').onclick=()=>{if(!dirty||confirm('¿Salir sin guardar los cambios?'))showList()};$('save').onclick=()=>{if(save()){$('save').textContent='Guardado';setTimeout(()=>$('save').textContent='Guardar',900)}};$('script').oninput=()=>{dirty=true;stats()};$('name').oninput=()=>dirty=true;$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({scripts,prefs},null,2)],{type:'application/json'}));a.download='juandiprompter-copia.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const data=JSON.parse(await $('file').files[0].text());if(!Array.isArray(data.scripts)||!data.scripts.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&typeof s.text==='string'))throw Error();for(const s of data.scripts){if(!scripts.some(x=>x.id===s.id))scripts.push(s);else if(!scripts.some(x=>x.name===s.name&&x.text===s.text))scripts.push({...s,id:crypto.randomUUID?.()??String(Date.now())+Math.random()})}store('jp-scripts',scripts);showList()}catch{alert('Archivo no válido.')}finally{$('file').value=''}};
function apply(){const w=$('words'),v=$('viewport');w.style.fontSize=prefs.size+'px';w.style.width=prefs.width+'%';w.style.paddingTop=v.clientHeight*.38+'px';w.style.paddingBottom=v.clientHeight*.62+'px';$('scroll').style.transform=`scale(${prefs.flip.includes('x')?-1:1},${prefs.flip.includes('y')?-1:1})`;$('cue').style.top=prefs.flip.includes('y')?'62%':'38%';$('status').textContent=prefs.speed+' ppm';for(const k of ['speed','size','width','delay','flip'])$(k).value=prefs[k];for(const k of ['speed','size','width'])$(k+'val').textContent=prefs[k];$('mirror').textContent=prefs.flip==='none'?'Espejo':'Espejo activo';store('jp-prefs',prefs)}function update(){const s=$('scroll');$('progress').firstElementChild.style.width=(100*s.scrollTop/Math.max(1,s.scrollHeight-s.clientHeight))+'%'}function stop(){playing=false;waiting=false;clearInterval(timer);$('count').hidden=true;$('play').textContent='▶ Iniciar';if(wake){wake.release().catch(()=>{});wake=null}}async function begin(){playing=true;last=0;pos=$('scroll').scrollTop;$('play').textContent='Ⅱ Pausar';try{const lock=await navigator.wakeLock?.request('screen');if(playing)wake=lock;else lock?.release()}catch{}}function toggle(){if(playing||waiting){stop();return}if(!prefs.delay){begin();return}waiting=true;let n=prefs.delay;$('count').textContent=n;$('count').hidden=false;$('play').textContent='Cancelar';timer=setInterval(()=>{if(--n<=0){clearInterval(timer);waiting=false;$('count').hidden=true;begin()}else $('count').textContent=n},1000)}function jump(n){let s=$('scroll');s.scrollTop=Math.max(0,n);pos=s.scrollTop;update()}function block(dir){const s=$('scroll'),pad=parseFloat($('words').style.paddingTop)||0;const offsets=blocks.map(b=>b.offsetTop-pad);let here=s.scrollTop;let target=dir>0?offsets.find(x=>x>here+8):offsets.filter(x=>x<here-8).at(-1);jump(target??(dir>0?s.scrollHeight:0))}function tick(t){if(playing&&!$('reader').hidden){if(last){const s=$('scroll'),w=$('words');const total=count($('script').value);const length=Math.max(1,s.scrollHeight-s.clientHeight);pos+=Math.min(t-last,100)/1000*prefs.speed/60*length/Math.max(1,total);s.scrollTop=pos;if(pos>=length){jump(length);stop()}}last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);$('start').onclick=()=>{if(!save())return;$('home').hidden=true;$('reader').hidden=false;$('words').replaceChildren();blocks=$('script').value.trim().split(/\n\s*\n/).map(t=>{const p=document.createElement('div');p.textContent=t;p.style.marginBottom='1em';$('words').append(p);return p});apply();jump(0)};$('close').onclick=()=>{stop();$('reader').hidden=true;$('reader').classList.remove('clean');$('settings').hidden=true;$('home').hidden=false};$('play').onclick=toggle;$('reset').onclick=()=>{stop();jump(0)};$('prev').onclick=()=>block(-1);$('next').onclick=()=>block(1);function speed(n){prefs.speed=Math.max(40,Math.min(320,prefs.speed+n));apply()}$('slower').onclick=()=>speed(-5);$('faster').onclick=()=>speed(5);$('mirror').onclick=()=>{prefs.flip=prefs.flip==='none'?'x':'none';apply()};$('config').onclick=()=>{stop();$('settings').hidden=!$('settings').hidden};$('done').onclick=()=>$('settings').hidden=true;$('clean').onclick=()=>{$('reader').classList.add('clean');apply()};$('exitclean').onclick=()=>{$('reader').classList.remove('clean');apply()};for(const k of ['speed','size','width','delay','flip'])$(k).oninput=()=>{prefs[k]=k==='flip'?$(k).value:Number($(k).value);apply();pos=$('scroll').scrollTop};let touch=null;$('scroll').addEventListener('pointerdown',e=>{touch=[e.clientX,e.clientY]});$('scroll').addEventListener('pointerup',e=>{if(touch&&Math.hypot(e.clientX-touch[0],e.clientY-touch[1])<8)toggle();touch=null});$('scroll').addEventListener('wheel',()=>{stop()},{passive:true});$('scroll').addEventListener('touchmove',()=>{if(playing||waiting)stop()},{passive:true});$('scroll').onscroll=()=>{if(!playing)pos=$('scroll').scrollTop;update()};document.addEventListener('keydown',e=>{if($('reader').hidden||!$('settings').hidden||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;const fn={' ':toggle,ArrowUp:()=>speed(5),ArrowDown:()=>speed(-5),ArrowLeft:()=>block(-1),ArrowRight:()=>block(1),Escape:()=>$('close').click()}[e.key];if(fn){e.preventDefault();fn()}});window.addEventListener('resize',()=>{if(!$('reader').hidden){apply();pos=$('scroll').scrollTop}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});showList();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
